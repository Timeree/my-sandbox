[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mybox"
dynamic = ["version"]
description = "SSH tunnel and a no-auth FTP server behind any HTTP gateway"
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
mybox = "mybox.cli:main"

[tool.setuptools]
packages = ["mybox"]

[tool.setuptools.dynamic]
version = {attr = "mybox.__version__"}
