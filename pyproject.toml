[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mybox"
version = "1.0.0"
description = "SSH tunnel and a no-auth FTP server behind any HTTP gateway"
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
mybox = "mybox.cli:main"

[tool.setuptools]
packages = ["mybox"]
